    display: flex;
    justify-content: center;
    gap: 0.7rem;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 20px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    border: 1px solid var(--border);
  }
  .btn-primary {
    background: var(--sage-dark);
    color: white;
    border-color: var(--sage-dark);
  }
  .btn-secondary {
